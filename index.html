<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopJannat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
        <!-- Navbar Section Start-->
        <nav>
            <img src="assets/src/images/ShopJannat  Logo.png" alt="" class="logo">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Shop</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Contact</a></li>
            </ul>
            <button class="nav-btn">Login</button>
        <!-- Navbar Section End-->
        </nav>
<!-- Hero Section Start -->
<section class="hero" id="home">

    <!-- Hero Content -->
    <div class="hero-content">
        <p class="hero-subtitle">WELCOME TO SHOPJANNAT</p>

        <h1>
            Your One Stop Shop
            <span>for a Better You</span>
        </h1>

        <p class="hero-description">
            Discover amazing products, great prices and
            unbeatable quality. Shop smart, shop happy!
        </p>

        <a href="#shop" class="hero-btn">
            Shop Now <span>→</span>
        </a>
    </div>

    <!-- Hero Image -->
    <div class="hero-image">
        <img
            src="assets/src/images/shoppack.png"
            alt="ShopJannat Shopping Collection"
        >
    </div>

</section>
<!-- Hero Section End -->
   </header>
</body>
</html>
